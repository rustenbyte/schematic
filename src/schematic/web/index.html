<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>schematic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <button class="panel-toggle" id="toggle-rail" aria-controls="rail" aria-expanded="true" aria-label="Sheets and flows" title="Sheets and flows  [">
    <svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true"><rect x="1" y="1.5" width="16" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect class="pane" x="1.7" y="2.2" width="5" height="11.6" rx="1"/><path d="M7 1.5v13" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <span class="mark">
    <svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><rect x="5" y="2" width="12" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 2a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 6h4M1 9h4M1 12h4M17 6h4M17 9h4M17 12h4" stroke="currentColor" stroke-width="1.3"/></svg>
    schematic
  </span>
  <nav class="crumbs" id="crumbs" aria-label="Sheet path"></nav>
  <div class="states" role="group" aria-label="States">
    <label class="field">
      <span class="field-label">State</span>
      <span class="select"><select id="head"></select></span>
    </label>
    <label class="field">
      <span class="field-label">compared with</span>
      <span class="select"><select id="base"></select></span>
    </label>
  </div>
  <div class="theme segmented" role="group" aria-label="Theme">
    <button data-theme-choice="paper" aria-pressed="true">Paper</button>
    <button data-theme-choice="blueprint" aria-pressed="false">Blueprint</button>
  </div>
  <button class="panel-toggle" id="toggle-side" aria-controls="side" aria-expanded="true" aria-label="Details" title="Details  ]">
    <svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true"><rect x="1" y="1.5" width="16" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect class="pane" x="11.3" y="2.2" width="5" height="11.6" rx="1"/><path d="M11 1.5v13" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
</header>
<aside class="rail" id="rail">
  <section class="rail-block">
    <h2>Sheets</h2>
    <ol class="sheet-list" id="sheets"></ol>
  </section>
  <section class="rail-block flows">
    <h2><span id="flows-heading">Flows</span><button class="text-button" id="clear-flow" hidden>Clear</button></h2>
    <div class="search"><input id="filter" type="search" aria-labelledby="flows-heading" placeholder="Filter"></div>
    <div class="flow-groups" id="flows"></div>
  </section>
</aside>
<main class="stage" id="stage">
  <div class="progress" aria-hidden="true"></div>
  <svg id="drawing" aria-label="Sheet"></svg>
  <div class="toolbar sheet-tools" id="sheet-controls">
    <div class="segmented" role="group" aria-label="Group by">
      <button data-grouping="none" aria-pressed="true">No groups</button>
      <button data-grouping="role" aria-pressed="false">Roles</button>
      <button data-grouping="file" aria-pressed="false">Files</button>
      <button data-grouping="service" aria-pressed="false">Services</button>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <button class="tool" id="expand-all">Expand all</button>
    <button class="tool" id="collapse-all">Collapse all</button>
  </div>
  <div class="toolbar zoom" role="group" aria-label="Zoom">
    <button class="tool" id="zoom-out" aria-label="Zoom out">−</button>
    <button class="tool" id="zoom-fit">Fit</button>
    <button class="tool" id="zoom-in" aria-label="Zoom in">+</button>
  </div>
  <div class="title-block" id="title-block" aria-label="Title block"></div>
  <p class="notice" id="notice" role="alert" hidden></p>
</main>
<div class="resizer rail-resizer" id="resize-rail" role="separator" aria-orientation="vertical" aria-controls="rail" aria-label="Width of sheets and flows" tabindex="0" title="Drag to resize, double-click for the standard width"></div>
<div class="resizer side-resizer" id="resize-side" role="separator" aria-orientation="vertical" aria-controls="side" aria-label="Width of details" tabindex="0" title="Drag to resize, double-click for the standard width"></div>
<aside class="side" id="side" aria-label="Details">
  <div class="inspector" id="inspector"></div>
</aside>
<script src="/app.js"></script>
</body>
</html>
