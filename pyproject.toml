[project]
name = "schematic"
version = "0.1.0"
description = "Reads a Python application and maps its architecture: components, wires, routes and the flows its tests take."
readme = "README.md"
authors = [
    { name = "rustenbyte", email = "mickrustenburg@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14,<3",
]

[project.scripts]
schematic = "schematic.cli:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.165.0",
    "mypy==2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "RET", "C4", "PERF", "PL", "FBT", "S", "T20"]
ignore = ["PLR0913", "PLR2004", "S603"]
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915"]

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]
